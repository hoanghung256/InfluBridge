name: Deploy FE to Firebase Hosting

on:
    push:
        branches:
            - master

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                site: [PRODUCTION, TESTING]

        steps:
            - name: Checkout source
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install

            - name: Create env file for ${{ matrix.site }} site
              run: |
                  if [ "${{ matrix.site }}" = "TESTING" ]; then
                    echo "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}" >> .env.production
                    echo "VITE_CONVEX_URL=${{ secrets.TESTING_CONVEX_URL }}" >> .env.production
                    echo "VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env.production
                  else
                    echo "VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}" >> .env.production
                    echo "VITE_CONVEX_URL=${{ secrets.CONVEX_URL }}" >> .env.production
                    echo "VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env.production
                    echo "NODE_ENV=production" >> .env.production
                  fi

            - name: Build project for ${{ matrix.site }} site
              run: |
                  if [ "${{ matrix.site }}" = "PRODUCTION" ]; then
                    npm run build -- --outDir=dist-production
                  else
                    npm run build -- --outDir=dist-testing
                  fi

            - name: Install Firebase CLI
              run: npm install -g firebase-tools

            - name: Deploy to Firebase Hosting for ${{ matrix.site }} site
              run: |
                  if [ "${{ matrix.site }}" = "PRODUCTION" ]; then
                    firebase deploy --only hosting:influbridge
                  else
                    firebase deploy --only hosting:influbridge-testing
                  fi
              env:
                  FIREBASE_TOKEN: ${{ secrets.FIREBASE_CI_LOGIN_TOKEN }}
